services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: secaudit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: secaudit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secaudit"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://secaudit:${POSTGRES_PASSWORD:-change-me}@db:5432/secaudit
      CORS_ORIGINS: http://localhost:8080
      SKIP_VERIFICATION: ${SKIP_VERIFICATION:-false}
      ALLOW_PRIVATE_TARGETS: "false"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
